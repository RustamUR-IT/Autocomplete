name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FlowKit.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FlowKit.apk \
            --title "FlowKit – neuester Build" \
            --notes "Build #${{ github.run_number }} · FlowKit.apk herunterladen und auf dem Handy öffnen." \
            --target "${{ github.sha }}" --latest
