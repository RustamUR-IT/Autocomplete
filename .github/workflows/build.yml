name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly: keeps the signing key in the cache alive

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # One fixed signing key, created on GitHub once and kept in the Actions cache,
      # so every new APK installs over the previous one.
      - name: Restore signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: signing
          key: flowkit-signing-v1

      - name: Create signing key (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p signing
          openssl rand -hex 24 > signing/pass.txt
          PASS=$(cat signing/pass.txt)
          keytool -genkeypair -keystore signing/release.jks -alias flowkit \
            -storepass "$PASS" -keypass "$PASS" -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=FlowKit"

      - name: Save signing key
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: signing
          key: flowkit-signing-v1

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'

      - name: Build
        if: github.event_name != 'schedule'
        run: |
          export FLOWKIT_KEYSTORE="$GITHUB_WORKSPACE/signing/release.jks"
          export FLOWKIT_PASS="$(cat signing/pass.txt)"
          chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Publish release "latest"
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FlowKit.apk
          NOTES="Build #${{ github.run_number }} · FlowKit.apk herunterladen und auf dem Handy öffnen – installiert sich über die alte Version."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest FlowKit.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest FlowKit.apk --title "FlowKit – neuester Build" \
              --notes "$NOTES" --target "${{ github.sha }}" --latest
          fi
